[package]
name = "win11-notepad"
version = "1.0.0"
description = "Windows 11 Notepad look-alike for Linux"
edition = "2021"

[lib]
name = "win11_notepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"

[profile.release]
strip = true
opt-level = 3
